name: examples

on:
  push:
    paths:
      - "ruddy/**"
      - "examples/**"
      - "tools/run_notebook_gate.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/examples.yml"
  pull_request:
    paths:
      - "ruddy/**"
      - "examples/**"
      - "tools/run_notebook_gate.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/examples.yml"

jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --all-extras --group notebooks
      - name: Regenerate demo data
        run: bash examples/run_ci_examples.sh
      - name: Execute notebooks
        run: uv run python tools/run_notebook_gate.py
