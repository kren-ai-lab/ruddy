[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ruddy"
dynamic = ["version"]
description = "Domain-agnostic statistical exploratory data analysis for tabular datasets and feature representations."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Kren AI Lab", email = "krenai@umag.cl" },
]
maintainers = [
    { name = "David Medina-Ortiz" },
    { name = "Diego Alvarez-Saravia" },
]
keywords = [
    "exploratory-data-analysis",
    "statistics",
    "tabular-data",
    "multivariate-analysis",
    "factorial-analysis",
    "dimensionality-reduction",
    "scientific-software",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]

dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "scipy>=1.11,<2",
    "scikit-learn>=1.4,<2",
    "statsmodels>=0.14,<1",
    "typer>=0.27,<1",
    "rich>=15.0,<16.0",
]

[project.scripts]
ruddy = "ruddy.cli.main:main"

[project.optional-dependencies]
manifold = [
    "umap-learn>=0.5.7,<1",
]

[project.urls]
Homepage = "https://github.com/kren-ai-lab/ruddy"
Repository = "https://github.com/kren-ai-lab/ruddy"
Issues = "https://github.com/kren-ai-lab/ruddy/issues"
Documentation = "https://github.com/kren-ai-lab/ruddy#readme"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.1",
    "ruff>=0.16",
    "pyrefly",
    "taskipy>=1.14",
    "prek",
]
examples = [
    "marimo>=0.24",
    "matplotlib>=3.8",
    "plotly>=5.20",
]

[tool.hatch.version]
path = "ruddy/_version.py"
pattern = '__version__ = "(?P<version>[^"]+)"'

[tool.hatch.build.targets.sdist]
include = ["/ruddy"]

[tool.hatch.build.targets.wheel]
packages = ["ruddy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "CPY001",
    "D203",
    "D213",
    "N803",
    "N806",
    "PLR0913",
    # Permanent, deliberate exceptions for a scientific library.
    # A raise here names the offending data ("n_components (5) exceeds
    # rank (3)"), which is more useful than a class per failure mode.
    "TRY003",
    "EM101",
    "EM102",
    # Statistical thresholds and minimum sample sizes read better inline
    # (`if n < 3`, `if p < 0.05`) than behind a named constant.
    "PLR2004",
    # Estimators branch on diagnostics and degenerate cases by design;
    # splitting them to satisfy a complexity budget would obscure the
    # numerical path and risk changing results.
    "C901",
    "PLR0911",
    "PLR0912",
    "PLR0915",
    "PLR0917",
]

[tool.ruff.lint.per-file-ignores]
"ruddy/cli/*" = [
    "A002",    # `input` is the documented positional argument of every command
    "FBT001",  # bool flags are standard in CLI functions
    "FBT003",
    "T201",    # commands print machine-readable JSON to stdout by contract
    "TC001",   # typer resolves annotations at runtime, so they stay imported
    "TC002",
    "TC003",
]
"tests/*" = [
    "ANN",     # test helpers are not part of the typed public surface
    "D",       # docstrings are not required in tests
    "INP001",  # test packages are intentionally implicit namespaces
    "PLC0415",
    "PLR2004", # tests compare against literal expected values by design
    "PT011",
    "PT017",
    "PT018",
    "S101",    # assert is how a test asserts
    "TC003",   # pytest resolves fixture annotations at runtime
]
# Transitional. The rules below are not enforced in the scientific modules
# yet; they come off this list in later passes, one package at a time.
"ruddy/{analysis,anomaly,bayesian,bivariate,compositional,data,factorial,multivariate,profiling,projections,representation,results,statistics,univariate}/*" = [
    "ANN001",
    "ANN202",
    "ANN401",
    "B023",
    "BLE001",
    "D101",
    "D102",
    "D103",
    "D105",
    "D107",
    "E501",
    "E721",
    "FBT003",
    "PD101",
    "PERF401",
    "PLC0415",
    "RUF002",
    "TRY004",
]
"examples/*" = [
    "INP001",  # example scripts are intentionally standalone modules
    "PLR2004", # small referential scripts can compare against literal sizes
    "T201",    # examples print result snippets by design
]

[tool.pyrefly]
# Without a config section Pyrefly falls back to the `basic` preset, which
# silences most of its checks; `default` is the real baseline.
preset = "default"
project-includes = ["ruddy", "tests"]

[tool.taskipy.tasks]
sort-imports = "ruff check --fix --select I,F401 ruddy/ tests/"
format = "task sort-imports && ruff format ruddy/ tests/"
lint = "ruff check ruddy/ tests/"
lint-fix = "ruff check --fix ruddy/ tests/"
test = "pytest -q"
test-v = "pytest -v"
test-cov = "pytest --cov=ruddy --cov-report=html"
pyrefly = "pyrefly check ruddy/ tests/"
