[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ruddy"
dynamic = ["version"]
description = "Domain-agnostic statistical exploratory data analysis for tabular datasets and feature representations."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Kren AI Lab", email = "krenai@umag.cl" },
]
maintainers = [
    { name = "David Medina-Ortiz" },
    { name = "Diego Alvarez-Saravia" },
]
keywords = [
    "exploratory-data-analysis",
    "statistics",
    "tabular-data",
    "multivariate-analysis",
    "factorial-analysis",
    "dimensionality-reduction",
    "scientific-software",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]

dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "scipy>=1.11,<2",
    "scikit-learn>=1.4,<2",
    "statsmodels>=0.14,<1",
    "pydantic>=2.7,<3",
]

[project.scripts]
ruddy = "ruddy.cli.main:main"

[project.optional-dependencies]
manifold = [
    "umap-learn>=0.5.7,<1",
]

[project.urls]
Homepage = "https://github.com/kren-ai-lab/ruddy"
Repository = "https://github.com/kren-ai-lab/ruddy"
Issues = "https://github.com/kren-ai-lab/ruddy/issues"
Documentation = "https://github.com/kren-ai-lab/ruddy#readme"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.1",
    "ruff>=0.16",
    "ty",
    "pyrefly",
    "taskipy>=1.14",
    "prek",
]

[tool.hatch.version]
path = "ruddy/_version.py"
pattern = '__version__ = "(?P<version>[^"]+)"'

[tool.hatch.build.targets.sdist]
include = ["/ruddy"]

[tool.hatch.build.targets.wheel]
packages = ["ruddy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.taskipy.tasks]
sort-imports = "ruff check --fix --select I,F401 ruddy/ tests/ tools/"
format = "task sort-imports && ruff format ruddy/ tests/ tools/"
lint = "ruff check ruddy/ tests/ tools/"
lint-fix = "ruff check --fix ruddy/ tests/ tools/"
test = "pytest -q"
test-v = "pytest -v"
test-cov = "pytest --cov=ruddy --cov-report=html"
ty = "ty check ruddy/ tests/ tools/"
pyrefly = "pyrefly check ruddy/ tests/ tools/"
