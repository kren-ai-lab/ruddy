[build-system]
requires = ["setuptools>=77.0", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "ruddy"
version = "0.1.0.dev0"
description = "Domain-agnostic statistical exploratory data analysis for tabular datasets and feature representations."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "KrenAI Lab" },
]
maintainers = [
    { name = "David Medina-Ortiz" },
    { name = "Diego Alvarez-Saravia" },
]
keywords = [
    "exploratory-data-analysis",
    "statistics",
    "tabular-data",
    "multivariate-analysis",
    "factorial-analysis",
    "dimensionality-reduction",
    "scientific-software",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]

dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "scipy>=1.11,<2",
    "scikit-learn>=1.4,<2",
    "statsmodels>=0.14,<1",
    "pydantic>=2.7,<3",
]

[project.scripts]
ruddy = "ruddy.cli.main:main"

[project.optional-dependencies]
manifold = [
    "umap-learn>=0.5.7,<1",
]
dev = [
    "pytest>=8.2,<10",
    "pytest-cov>=5,<7",
    "ruff>=0.8,<1",
    "mypy>=1.11,<2",
    "build>=1.2,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ruddy = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
packages = ["ruddy"]
warn_unused_configs = true
warn_return_any = true
no_implicit_optional = true
